[extension]
module = "pathlike"
# The tests/static TUs hold the exhaustive compile-time proof suites: wiring
# them into the sources means every build proves the invariants (an unwired
# static test file tests nothing). They contribute no runtime code.
sources = [
  "adapter/bindings.cpp",
  "adapter/third_party/simdjson/simdjson.cpp",
  "../../../tests/static/pathlike_core_proofs.cpp",
  "../../../tests/static/pathlike_scalar_proofs.cpp",
  "../../../tests/static/pathlike_parity_proofs.cpp",
]
# The path/file class is written against C++26 (constexpr dispatch, etc.); the
# global default is C++23, so this extension overrides just its own -std flag.
std = "c++26"
# P2996 static reflection (GCC 16: -freflection) is used as a proof layer only
# (engine_list.h, bindings.cpp): the glob-generated engine list must equal the
# engine structs the compiler sees, and every engine must be named after its
# struct. Compilers without the flag build the same code without those proofs.
flags_if_supported = ["-freflection"]

# The engine registry is OPEN: every header in adapter/engines/ is one engine.
# The build globs the directory into build/gen/pathlike/pathlike_engines.gen.h
# (includes + `using Engines = engine_list<engines::json, ...>`), which
# bindings.cpp consumes. Adding a format = adding a header here. See engine_list.h.
[extension.typelist]
glob = "adapter/engines/*.h"
header = "pathlike_engines.gen.h"
namespace = "pygim::pathlike::engines"
template = "pygim::pathlike::engine_list"
alias = "pygim::pathlike::Engines"
