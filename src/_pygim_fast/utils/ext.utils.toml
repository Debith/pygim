[extension]
module = "utils"
# tests/static/python_names_proofs.cpp and core_utils_proofs.cpp prove the base headers'
# laws at compile time (wired into the sources so every build proves them; no runtime code).
# python_names_callspace_proofs.cpp proves python_names.h's whole generated call space against
# Python's own answers (generated by tests/unittests/python_names_callspace.py).
sources = [
  "bindings.cpp",
  "../../../tests/static/python_names_proofs.cpp",
  "../../../tests/static/python_names_callspace_proofs.cpp",
  "../../../tests/static/core_utils_proofs.cpp",
]
