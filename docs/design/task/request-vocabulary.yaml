# The request vocabulary for pygim — a draft, 2026-09-27, for a vocabulary study (docs/design/task/04_request_vocabulary.md).
#
# The one source for the draft: the review page's tables and the first-round vocabulary a study hands
# its runs are both rendered from this file (render_request_vocabulary.py). Values that exist today
# keep their live entries — the renderer reads them from the stores' vocabularies — and add only their
# words; new values carry a full codebook entry. Nothing here is live until the owner accepts a pack.
#
# round: first    — the agent chooses it from the request alone, every value offered
#        resolved — found by retrieval from what the first round chose, confirmed by the retag
#        memory   — describes stored knowledge, set when a memory is written; never asked of a request

dimensions:
  domain:    {facet: field,    round: first,    role: hard}
  task:      {facet: activity, round: first,    role: hard}
  artifact:  {facet: object,   round: first,    role: hard}
  subject:
    facet: subject
    round: first
    role: soft
    status: new
    entry:
      brief: What the thing acted on is about, in the field's own words.
      full: >
        The topic a request is about, named the way a request names it — configuration, version
        control, file formats — rather than by where it lives in a project. Several may apply. It is
        what retrieval resolves into places: a subject names what the project ships for it, the files
        that concern it and the memories filed under it.
      when: Every request is about something; name each subject its words or its context point to.
      when_not: Not the kind of thing acted on — that is artifact; not the part of a project it lives in — that is resolved, never asked.
      example: '"Analyze this file: src/_pygim/_config.py" is subject=configuration, and, once the file is read, subject=dependency_injection.'
  concern:   {facet: quality,  round: first,    role: soft}
  component: {facet: place,    round: resolved, role: hard}
  layer:     {facet: place,    round: resolved, role: soft}
  language:  {facet: place,    round: resolved, role: soft}
  kind:      {facet: memory,   round: memory,   role: soft}
  tier:      {facet: memory,   round: memory,   role: soft}

values:
  # ── domain: the field ─────────────────────────────────────────────────────────────────────────
  - {tag: domain=software, store: global, words: [code, program, library, repository, build, test, command]}
  - {tag: domain=pygim, store: pygim, words: [pygim, oo, enact, pathlike, pathset, extension]}

  # ── task: the activity ────────────────────────────────────────────────────────────────────────
  - {tag: task=design, store: pygim, words: [design, propose, plan out, sketch, approach, how should, new]}
  - {tag: task=critique, store: pygim, words: [review, analyze, critique, assess, what do you think, check this]}
  - {tag: task=evaluate, store: pygim, words: [measure, benchmark, compare, how much, how fast, verify against]}
  - {tag: task=troubleshoot, store: pygim, words: [fix, bug, broken, fails, error, why does, not working]}
  - tag: task=explain
    store: pygim
    status: changed
    entry:
      brief: Making a thing understood now, in the answer.
      when: The request's goal is understanding — a question, a summary, what a thing is, how or why it works — and nothing is judged, changed or written to a file.
      when_not: Not the reasoning an answer gives while doing something else — a critique or a design explains itself, and that is not explain; not a file for a reader — that is document.
      example: '"What do you know about pathlike at the moment?" is task=explain.'
    words: [explain, how does, what is, why, show me, summarize]
    evidence: [A33, E09, F01]
  - tag: task=implement
    store: pygim
    status: changed
    entry:
      brief: Carrying out a decided change to code so that it works.
      when: The request asks to write, change, restructure, test or land code, tests or configuration that are already decided.
      when_not: Not deciding what to build — that is design; not writing a document — that is document, and a change that brings its design document along is both.
      example: Where to put the lock so the checks cannot race; lifting a shared helper into utils once a second caller appears.
    words: [implement, add, write, build, change, wire up, refactor]
  - tag: task=document
    status: new
    entry:
      brief: Writing a thing down for a reader to open later.
      full: >
        Making a thing understood later rather than now. The result is a file in the project — a design
        document, a report, a review, a readme — that a person opens after the conversation is over. The
        same understanding given in the answer is explain; given to agents through the memory, it is record.
      when: The request asks for a document, a report, a write-up or a section to be written or changed, or its work has to end in a file a person will read.
      when_not: Not an answer in the conversation — that is explain; not knowledge stored for agents — that is record; not a change to code — that is implement, and a change that brings its design document along is both.
      example: '"Write them to markdown so I can review them" is task=document.'
    words: [document, write up, write it into, markdown, report, readme, docs]
    evidence: [A37, A43, D27]
  - tag: task=discover
    status: new
    entry:
      brief: Finding out what the project already has before acting.
      full: >
        Surveying what exists inside the project — what it ships, its designs, its memories, its open work —
        so that what follows builds on it rather than beside it. The same looking outside the project is
        research.
      when: The request cannot be answered or done well without first knowing what is here — the best way within this project, what already exists, what is next.
      when_not: Not what is known outside the project — that is research; not measuring what exists against a standard — that is evaluate; not judging it — that is critique.
      example: '"Eventbus as a generic component?" is task=discover first: what pygim already ships for messaging.'
    words: [discover, discovery, best way, what do we have, already have, what exists, what is next, go through]
    evidence: [A10, A19, C04, C16, E15, E16, E22, F26]
  - tag: task=research
    status: new
    entry:
      brief: Finding out what is known outside the project before deciding.
      full: >
        Looking at how others solve it — libraries, papers, approaches, the options and their trade-offs —
        before a design or a choice is made. Looking at what the project itself already has is discover.
      when: The request asks for the options or what others do, or brings outside work — a paper, a report, a library — to be weighed.
      when_not: Not what the project already has — that is discover; not making the design — that is design, which research comes before; not measuring against a standard — that is evaluate.
      example: '"EVOLVING MEMORY & CONTEXT SYSTEMS" — a pasted outside report to weigh — is task=research.'
    words: [research, study, options, alternatives, prior art, how do others, look into, state of the art, paper]
    evidence: [A10, C04, C16, C18, E22, F26]
  - tag: task=operate
    status: new
    entry:
      brief: Running, stopping or changing the state of something that runs.
      when: The request asks to start, stop, restart, reload, deploy or configure a running program, server or session.
      when_not: Not changing the program's code — that is implement; not finding why it misbehaves — that is troubleshoot.
      example: '"Can you kill the server" is task=operate on a running process.'
    words: [kill, stop, start, restart, reload, run, serve, deploy, shut down]
    evidence: [B22, B30, D03, D29]
  - tag: task=record
    status: new
    entry:
      brief: Capturing knowledge so that it outlives the task.
      when: The request asks to remember, write down or store a rule, a preference, a lesson, a decision or a procedure.
      when_not: Not writing a document for people to read — that is document; not explaining something now — that is explain.
      example: '"There should be something in memory for this" is task=record.'
    words: [remember, memorize, record, store, lesson, write down, procedure, preference]
    evidence: [B13, B19, B32, C22, F09]
  - tag: task=plan
    status: new
    entry:
      brief: Ordering work that is already decided — what next, in which order.
      when: The request asks for next steps, an order of work, a merge order, or what is still outstanding.
      when_not: Not deciding what to build — that is design; not doing the work — that is implement.
      example: '"Merged, rebase then tell me next steps" is task=plan.'
    words: [next steps, order, outstanding, what now, roadmap, merge order, priority]
    evidence: [A09, A19]

  # ── artifact: the object ──────────────────────────────────────────────────────────────────────
  - {tag: artifact=extension, store: pygim, words: [extension, module, compiled, manifest, pybind]}
  - {tag: artifact=api, store: pygim, words: [interface, API, method, function, signature, stub, public]}
  - {tag: artifact=service, store: pygim, words: [service, server object, lifecycle, state, thread]}
  - {tag: artifact=store, store: pygim, words: [store, on-disk, layout, format on disk, files it writes]}
  - {tag: artifact=protocol, store: pygim, words: [protocol, JSON-RPC, messages, wire]}
  - {tag: artifact=design_doc, store: pygim, words: [design, document, section, overview, spec, doc]}
  - {tag: artifact=test, store: pygim, words: [test, fixture, suite, assertion, proof]}
  - {tag: artifact=benchmark, store: pygim, words: [benchmark, timing, measurement, profile]}
  - {tag: artifact=cli_command, store: pygim, words: [command, oo, flag, option, output, banner]}
  - {tag: artifact=vocabulary, store: pygim, words: [vocabulary, tag, dimension, value, pack, taxonomy]}
  - {tag: artifact=release, store: pygim, words: [release, version, wheel, publish, PyPI]}
  - {tag: artifact=report, store: pygim, words: [report, findings, study, analysis, summary]}
  - tag: artifact=source_module
    status: new
    entry:
      brief: One source file or module, as code — not its public surface.
      when: The request names or points to a file or module to read, review or change as code.
      when_not: Not the surface callers see — that is api; not a compiled module as a whole — that is extension.
      example: '"Analyze this file: src/_pygim/_config.py" is artifact=source_module.'
    words: [this file, module, source, .py, .h, .cpp, class, function body]
    evidence: [C23, F11, F12, F13, F14, F15, F16, F17]
  - tag: artifact=web_page
    status: new
    entry:
      brief: A page a program serves to a browser, and what the reader does on it.
      when: The request is about what a served page shows or lets the reader do — its buttons, colours, layout, scrolling.
      when_not: Not the document the page renders — that is design_doc; not the command that serves it — that is cli_command.
      example: '"Can you make next and previous buttons" on the served documents is artifact=web_page.'
    words: [page, button, browser, highlight, colour, scroll, click, view, served]
    evidence: [A29, A30, B01, D01, D02, D08, D09, D10, D11, D12, D14]
  - tag: artifact=change
    status: new
    entry:
      brief: A recorded change to the code — a commit, a branch, a pull request.
      when: The request is about making, reshaping or landing a change in version control.
      when_not: Not the code the change contains — name that artifact too; not a published version — that is release.
      example: '"commit the fix to banner" is artifact=change.'
    words: [commit, branch, pull request, PR, merge, rebase, squash, push, stash, history]
    evidence: [A07, A09, A10, A26, A31, E22, E24]
  - tag: artifact=process
    status: new
    entry:
      brief: A program as it runs — a server, a session, a background job.
      when: The request is about a running program's state — whether it is up, which one, how to stop or restart it.
      when_not: Not the program's code — that is source_module or extension; not a long-lived object inside a program — that is service.
      example: '"Can you kill the server" is artifact=process.'
    words: [server, process, running, port, pid, session, background, job]
    evidence: [B06, B22, B30, D03]
  - tag: artifact=agent_context
    status: new
    entry:
      brief: What an agent is given without asking — session-start text, hooks, instructions, prompts.
      when: The request is about what reaches an agent, when, and in what form.
      when_not: Not the knowledge itself — that is a memory, tagged by its own subject; not the service that stores it — that is service or store.
      example: '"Is this all useful session start content?" is artifact=agent_context.'
    words: [session start, hook, prompt, instructions, context, delivered, standing, mailbox]
    evidence: [B17, C05, D25, D27, D28, D29, D30]

  # ── subject: what it is about (new dimension; values for software) ─────────────────────────────
  - tag: subject=configuration
    status: new
    entry:
      brief: "Settings a program reads from outside itself."
      when: "About environment variables, settings files, defaults and where a program reads them."
      when_not: "Not how the read values are handed on — that is dependency_injection."
      example: "Where PYGIM_ENACT_ROOT is read, and what wins over it."
    words: [configuration, settings, environment variables, config, defaults, home directory, working directory]
    resolves: [component=wiring]
    evidence: [F11, F12, F13, F14, F15, F16, F17]
  - tag: subject=dependency_injection
    status: new
    entry:
      brief: "How the parts of a program are built and handed to each other."
      when: "About the composition root, wiring, containers, and handing a component what it needs."
      when_not: "Not the settings themselves — that is configuration."
      example: "One composition root builds every component from plain values."
    words: [composition root, wiring, dependency injection, container, IoC, factory, hidden dependency]
    resolves: [component=wiring]
    evidence: [A08, C18, E17, F17]
  - tag: subject=software_design
    status: new
    entry:
      brief: "The shape of code — objects, responsibilities, patterns."
      when: "About which object owns which behaviour, strategies, layering, domain models."
      when_not: "Not one mechanism named here — use dependency_injection or data_structures when they fit."
      example: "A strategy owns the storage behaviour; the adapter only translates."
    words: [design pattern, strategy, domain model, domain-driven design, layering, adapter, responsibility, template]
    evidence: [A16, B39, C11, C33, F10]
  - tag: subject=file_system
    status: new
    entry:
      brief: "Paths, directories and files on disk."
      when: "About locating, walking, naming or comparing paths and files."
      when_not: "Not what a file's content means — that is file_format."
      example: "A relative path is sliced out of a string because the path type has no relative_to."
    words: [path, directory, folder, file system, walk, glob, relative path, uri]
    resolves: [component=pathlike]
    evidence: [B14, B15, C19, F01, F02]
  - tag: subject=file_format
    status: new
    entry:
      brief: "How data is written into a file and read back."
      when: "About parsing, serialising or supporting a format — YAML, JSON, TOML, HTML."
      when_not: "Not where the file lives — that is file_system."
      example: "Adding a new file type means adding one engine header."
    words: [yaml, json, toml, html, format, file type, parse, serialise, reader, writer, engine]
    resolves: [component=pathlike]
    evidence: [C31, D31, F20, F21]
  - tag: subject=command_line
    status: new
    entry:
      brief: "How a program is used from a terminal."
      when: "About commands, options, help and what a command prints."
      when_not: "Not the library behind a command — name its own subject."
      example: "The banner the oo command prints first."
    words: [command line, CLI, command, option, flag, help, output, banner, terminal]
    resolves: [component=cli]
    evidence: [B12, C09, C10, E21, E22]
  - tag: subject=web_ui
    status: new
    entry:
      brief: "What a served page shows and how a reader works with it."
      when: "About pages in a browser — rendering, navigation, marks, comments on a page."
      when_not: "Not the text a page renders — that is documentation."
      example: "A change since the last read is tinted on the page."
    words: [page, browser, button, tint, scroll, served, localhost, comment on page]
    resolves: [component=docs, component=cli]
    evidence: [D01, D02, D08, D10]
  - tag: subject=documentation
    status: new
    entry:
      brief: "What documents say, and how they are written and kept."
      when: "About the content, structure or style of design documents, reports and comments in code."
      when_not: "Not how a served page behaves — that is web_ui; not drawing a diagram — that is diagrams."
      example: "Lead a design document with scenarios."
    words: [document, docs, section, scenario, overview, code comments, writing, style]
    resolves: [component=docs]
    evidence: [A17, A42, A43, C34]
  - tag: subject=diagrams
    status: new
    entry:
      brief: "Drawing structure or sequence as a picture."
      when: "About class, sequence, flow or state diagrams, and how they are drawn."
      when_not: "Not the document around them — that is documentation."
      example: "Number a sequence diagram's steps and give its table one row per number."
    words: [diagram, sequence diagram, class diagram, mermaid, flowchart, arrows]
    resolves: [component=docs]
    evidence: [A02, A34, A45, D27]
  - tag: subject=version_control
    status: new
    entry:
      brief: "Recording, sharing and combining changes to code."
      when: "About commits, branches, merging, rebasing and pull requests."
      when_not: "Not building or publishing the result — that is continuous_integration or packaging."
      example: "Split unrelated work into its own commits."
    words: [git, commit, branch, merge, rebase, pull request, push, stash, squash, history]
    evidence: [A07, A09, A10, A26, A31, E01, E22, E24]
  - tag: subject=continuous_integration
    status: new
    entry:
      brief: "What runs automatically on every change, and publishing its result."
      when: "About CI workflows, their failures, release pipelines and publishing packages."
      when_not: "Not the local build — that is packaging."
      example: "Watch the CI run until it is green after every push."
    words: [CI, workflow, GitHub Actions, pipeline, release, publish, PyPI, matrix]
    resolves: [component=build]
    evidence: [A07, B18, E05, E20, E23]
  - tag: subject=packaging
    status: new
    entry:
      brief: "Building and installing the program on a machine."
      when: "About build systems, environments, installs and compilers."
      when_not: "Not what runs in CI — that is continuous_integration."
      example: "Editable installs need --no-build-isolation."
    words: [build, install, conda, pip, wheel, pyproject, environment, compiler, editable]
    resolves: [component=build]
    evidence: [A04, E04, E05]
  - tag: subject=testing
    status: new
    entry:
      brief: "Tests as a subject — how a thing is proven."
      when: "About writing, isolating, organising or running tests and fixtures."
      when_not: "Not the property of being provable — that is concern=testing; not measuring speed — that is performance work under task=evaluate."
      example: "Build a test's world inside the test."
    words: [test, fixture, isolation, pytest, suite, end to end, regression]
    evidence: [B32, C16, C18, D28, F04, F05]
  - tag: subject=data_structures
    status: new
    entry:
      brief: "How data is held in memory for fast use."
      when: "About tables, sets, bit sets, interning, indexes and their cost."
      when_not: "Not how data is stored on disk — that is file_format or persistence."
      example: "Two path sets over one table intersect at bit speed."
    words: [table, bit set, interning, index, id set, container, memory footprint]
    resolves: [component=mapping, component=pathlike, component=utils]
    evidence: [A06, A13, A14, A15, A16, A21]
  - tag: subject=persistence
    status: new
    entry:
      brief: "Storing data in a database and reading it back."
      when: "About databases, SQL, bulk loads and columnar data for storage."
      when_not: "Not the files a program keeps for itself — that is file_format or store."
      example: "The BCP quickstart's batching rule."
    words: [database, SQL, ODBC, Arrow, bulk load, table, persistence]
    resolves: [component=persistence]
    evidence: [A03, A05, E10]
  - tag: subject=knowledge_retrieval
    status: new
    entry:
      brief: "Filing knowledge by tags and finding it again."
      when: "About vocabularies, tagging, classification, indexes, retrieval and citations of knowledge."
      when_not: "Not how an agent receives it without asking — that is agent_tooling."
      example: "Hard tags filter a read; soft tags only order it."
    words: [tags, vocabulary, taxonomy, classification, retrieval, citation, index, memory]
    resolves: [component=enact, component=mcp]
    evidence: [A48, B20, D31, E11, E18]
  - tag: subject=agent_tooling
    status: new
    entry:
      brief: "How an AI agent is set up, fed and coordinated."
      when: "About hooks, session-start text, instructions, MCP servers, subagents and messages between sessions."
      when_not: "Not the knowledge being fed — that is knowledge_retrieval or the knowledge's own subject."
      example: "The request hook delivers the procedure a request asks for."
    words: [hook, session start, agent, subagent, MCP, prompt, instructions, mailbox]
    resolves: [component=mcp, component=enact, component=cli]
    evidence: [B06, B17, C06, D25, D30, F03]
  - tag: subject=running_services
    status: new
    entry:
      brief: "Programs that keep running — servers, daemons, sessions — and their state."
      when: "About starting, stopping, reloading or finding a running program."
      when_not: "Not the code of the program — name its own subject."
      example: "Reload the server after changing its code."
    words: [server, process, restart, reload, port, running, background]
    resolves: [component=mcp, component=docs]
    evidence: [B06, B22, B30, D03, D13]

  # ── concern: the quality ──────────────────────────────────────────────────────────────────────
  - {tag: concern=correctness, store: pygim, words: [correct, wrong, right answer, bug]}
  - {tag: concern=performance, store: pygim, words: [fast, slow, memory, speed, cost in time]}
  - {tag: concern=portability, store: pygim, words: [Windows, macOS, platform, Python version]}
  - {tag: concern=testing, store: pygim, words: [testable, provable, isolation]}
  - {tag: concern=documentation, store: pygim, words: [documented, explained, readable docs]}
  - {tag: concern=toolchain, store: pygim, words: [compiler, linker, flags, toolchain]}
  - {tag: concern=lifetime, store: pygim, words: [ownership, lifetime, dangling, reference]}
  - {tag: concern=threading, store: pygim, words: [thread, lock, GIL, concurrent]}
  - {tag: concern=public_api, store: pygim, words: [public, caller sees, signature, breaking]}
  - tag: concern=usability
    status: new
    entry:
      brief: "How easily a person reads, finds or acts on something."
      when: "About readable output, glance value, reviewability, and how much a person must work to use a thing."
      when_not: "Not how it looks — that is appearance; not whether it is right — that is correctness."
      example: "An approval prompt that shows an id instead of the text cannot be reviewed."
    words: [readable, easy, confusing, glance, find, review, understand]
    evidence: [B28, C09, C10]
  - tag: concern=appearance
    status: new
    entry:
      brief: "How something looks."
      when: "About look and feel — colour, style, visual appeal, \"cooler\"."
      when_not: "Not how easily it is used — that is usability."
      example: "\"give me some cooler version the banner logo\" is concern=appearance."
    words: [look, cool, cooler, pretty, colour, style, visual]
    evidence: [D02, E22]
  - tag: concern=security
    status: new
    entry:
      brief: "Keeping data and access safe."
      when: "About secrets, encryption, privacy, and what may leave the machine."
      when_not: "Not correctness in general."
      example: "A store that must never commit plaintext."
    words: [secure, encrypt, private, secret, leak, credentials]
    evidence: [B34]
  - tag: concern=cost
    status: new
    entry:
      brief: "What a thing spends — tokens, money, a person's time."
      when: "About how much context, tokens or effort something costs."
      when_not: "Not a program's speed — that is performance."
      example: "How many tokens a month were spent on errors."
    words: [tokens, cost, wasted, budget, expensive, money]
    evidence: [F26]
