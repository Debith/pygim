name: Release

# A release is a branch, release/<version>, cut from main. Every run builds
# wheels for each supported platform and Python, runs the test suite against
# the installed wheels, and only then publishes to PyPI, tags v<version> and
# creates the GitHub release. See docs/releasing.md.
#
#   gh workflow run release.yml -f bump=minor         # the next minor version, from main
#   gh workflow run release.yml -f version=0.2.0rc1   # an explicit version, from main
#   git push origin origin/main:refs/heads/release/0.2.0
#
# A pull request that changes the release machinery runs it as a dry run: the
# same builds and tests, nothing published.

on:
  push:
    branches: ["release/**"]
  workflow_dispatch:
    inputs:
      bump:
        description: Part of the latest release to increment (ignored when a version is given)
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Explicit PEP 440 version, e.g. 0.2.0 or 0.2.0rc1 (overrides bump)
        type: string
        default: ""
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/scripts/**

# One release at a time; dry runs of a pull request replace each other.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('release-dry-run-{0}', github.ref) || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # A dispatched release is always cut from main, whichever ref ran it.
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || '' }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
        run: |
          python -m pip install --quiet packaging
          python .github/scripts/release_version.py
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Refuse a release branch that already exists
        if: github.event_name == 'workflow_dispatch'
        env:
          BRANCH: release/${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "::error title=Cannot release::$BRANCH already exists; a push to it runs its release."
            exit 1
          fi

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PUBLISH: ${{ steps.version.outputs.publish }}
        run: |
          {
            echo "### python-gimmicks $VERSION"
            echo "Commit: \`$(git rev-parse HEAD)\`"
            if [ "$PUBLISH" = true ]; then echo "Publishes to PyPI once every wheel passes its tests."
            else echo "Dry run: builds and tests only, nothing is published."; fi
          } >> "$GITHUB_STEP_SUMMARY"

  wheels:
    name: Wheel ${{ matrix.python }} (${{ matrix.os }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: [cp39, cp310, cp311, cp312, cp313, cp314]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cibuildwheel
        run: python -m pip install "cibuildwheel==4.2.*"

      - name: Build and test wheel
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          # No tag exists yet, so setuptools_scm is told the version.
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.prepare.outputs.version }}
          CIBW_ENVIRONMENT_PASS_LINUX: SETUPTOOLS_SCM_PRETEND_VERSION
          MACOSX_DEPLOYMENT_TARGET: "13.3"  # std::format / std::to_chars need 13.3

          CIBW_BUILD: ${{ matrix.python }}-*
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS_LINUX: x86_64
          CIBW_ARCHS_MACOS: arm64
          CIBW_ARCHS_WINDOWS: AMD64

          # Every extension is mandatory, so the builders need unixODBC.
          # Windows gets ODBC from the SDK.
          CIBW_BEFORE_ALL_LINUX: dnf install -y unixODBC-devel
          CIBW_BEFORE_ALL_MACOS: bash .github/scripts/build_unixodbc_macos.sh

          # Arrow's libraries belong to the pyarrow the wheel pins
          # (setup.py::_pin_arrow_abi) and are loaded from it: pygim imports
          # pyarrow before any extension. Vendoring them would load a second
          # Arrow beside pyarrow's.
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >-
            auditwheel repair --exclude 'libarrow*.so*' --exclude 'libparquet*.so*' -w {dest_dir} {wheel}
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: >-
            delocate-wheel --require-archs {delocate_archs} --exclude libarrow --exclude libparquet
            --ignore-missing-dependencies -w {dest_dir} -v {wheel}
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: >-
            delvewheel repair --exclude "arrow.dll;parquet.dll" -w {dest_dir} -v {wheel}

          # The whole suite, against the repaired wheel installed in a clean
          # environment: what PyPI will serve is what gets tested.
          CIBW_TEST_EXTRAS: test
          # pyodbc's macOS wheel (a test dependency) loads Homebrew's unixODBC,
          # as pyodbc documents; the pygim wheel carries its own.
          CIBW_BEFORE_TEST_MACOS: brew install unixodbc
          CIBW_TEST_COMMAND: pytest {project}/tests -p no:cacheprovider

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: dist-wheel-${{ matrix.os }}-${{ matrix.python }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install unixODBC (setup.py checks for sql.h before anything else)
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc-dev

      - name: Build sdist
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python -m pip install build twine
          python -m build --sdist --outdir dist
          python -m twine check --strict dist/*

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [prepare, wheels, sdist]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/python-gimmicks/${{ needs.prepare.outputs.version }}/
    permissions:
      id-token: write  # PyPI trusted publishing: no API token is stored
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  github-release:
    name: Tag and GitHub release
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.prepare.outputs.version }}
      SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Record the release branch
        # A dispatched release was built from main; its branch is created now
        # that it is published, so a failed run leaves nothing to clean up.
        run: |
          if ! gh api "repos/$GH_REPO/git/ref/heads/release/$VERSION" >/dev/null 2>&1; then
            gh api "repos/$GH_REPO/git/refs" -f ref="refs/heads/release/$VERSION" -f sha="$SHA"
          fi

      - name: Tag and create the GitHub release
        env:
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "v$VERSION" dist/* --target "$SHA" --title "v$VERSION" --generate-notes "${flags[@]}"
